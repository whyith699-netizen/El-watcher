name: Monitor E-Learning

on:
  schedule:
    - cron: "*/30 23 * * 0-5"
    - cron: "*/30 0-10 * * 1-6"
  workflow_dispatch:

concurrency:
  group: elearning-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - name: Run unit tests
        run: npm test
      - run: npx playwright install --with-deps chromium

      - name: Restore state
        run: |
          mkdir -p state
          if git ls-remote --heads origin state | grep -q state; then
            git fetch origin state --depth=1
            git checkout origin/state -- state/state.json 2>/dev/null || true
          fi
          if [ ! -f state/state.json ]; then
            echo '{"version":1,"items":[],"accounts":{},"meta":{}}' > state/state.json
          fi

      - name: Run monitor
        env:
          ELEARNING_BASE_URL: https://elearning.sma1klaten.sch.id
          ELEARNING_ACCOUNTS: a:XI-A:ELEARNING_USER_A:ELEARNING_PASS_A,b:XI-B:ELEARNING_USER_B:ELEARNING_PASS_B
          ELEARNING_USER_A: ${{ secrets.ELEARNING_USER_A }}
          ELEARNING_PASS_A: ${{ secrets.ELEARNING_PASS_A }}
          ELEARNING_USER_B: ${{ secrets.ELEARNING_USER_B }}
          ELEARNING_PASS_B: ${{ secrets.ELEARNING_PASS_B }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Jakarta
          FORCE_RUN: "1"
          ELW_NOTIFY_INITIAL: "0"
        run: npm run monitor

      - name: Commit state (hanya jika berubah)
        run: |
          git config user.name "el-watcher-bot"
          git config user.email "bot@el-watcher.local"
          git add -f state/state.json
          if git diff --cached --quiet; then
            echo "State tidak berubah, skip commit"
          else
            git commit -m "state: update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin HEAD:state || {
              git fetch origin state --depth=1
              git rebase origin/state
              git push origin HEAD:state
            }
          fi
