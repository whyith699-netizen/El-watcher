<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EL Watcher</title>
  <style>
    body { font: 16px/1.6 system-ui, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 20px; color: #202124; }
    .notice { padding: 20px; border: 1px solid #f0c36d; background: #fff8e1; border-radius: 10px; }
    code { background: #f1f3f4; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>EL Watcher</h1>
  <div class="notice">
    <strong>Dashboard lokal dinonaktifkan untuk keamanan.</strong>
    <p>Kredensial tidak boleh dimasukkan atau disimpan di file HTML. Konfigurasikan akun melalui <code>.env</code>, lalu jalankan:</p>
    <pre><code>FORCE_RUN=1 npm run monitor -- --dry-run</code></pre>
    <p>Mode dry-run tidak mengirim Telegram dan tidak mengubah state.</p>
  </div>
</body>
</html>
